name: build-and-deploy
on: [push,pull]
workflow_run:
   workflows: ["test"]
   status: completed
  
permissions:
   contents: read
   packages: write


jobs:
   
  


   build:
   runs_on: ubuntu_latest

   steps: 
   - name : recuperer le code 
     uses : actions/checkout@v4


   - name : recuperer docker
   - uses: docker/setup-buildx-action@v3


   - name: se connecter a ghcr
     uses: docker/login-action@v3
     with:
       registry: ghcr.io
       username: ${{ github.actor }}
       password: ${{ secrets.GITHUB_TOKEN }}

    
   


   - name: register dans ghcr
     uses: docker/build-push-action@v6
     with : 
       context: .
       push: true
       tags: ghcr.io/${{ github.repository_owner }}/mon-api:latest




     